# Only install package versions that have been published for at least a week,
# to avoid picking up compromised or broken releases right after publication.
minimumReleaseAge: 10080

# core-js only prints a funding banner in its postinstall script.
allowBuilds:
  core-js: false

# Force patched versions of transitive dependencies (mostly webpack-dev-server
# and other build-time tooling pulled in by @docusaurus/core) flagged by
# `pnpm audit`, since Docusaurus itself does not yet bump them upstream.
# Targets are ranges bounded to the *same major* as the version Docusaurus
# depends on (">=fixed <nextMajor"), so pnpm keeps picking up new patch
# releases for these advisories automatically without ever crossing a major
# version boundary and pulling in breaking changes.
overrides:
  "qs@>=6.7.0 <=6.14.1": ">=6.14.2 <7.0.0"
  "serialize-javascript@<=7.0.2": ">=7.0.3 <8.0.0"
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0 <9.0.0"
  "svgo@>=3.0.0 <3.3.3": ">=3.3.3 <4.0.0"
  "path-to-regexp@<0.1.13": ">=0.1.13 <0.2.0"
  "brace-expansion@<1.1.13": ">=1.1.13 <2.0.0"
  "node-forge@<=1.3.3": ">=1.4.0 <2.0.0"
  "picomatch@<2.3.2": ">=2.3.2 <3.0.0"
  "lodash@>=4.0.0 <=4.17.23": ">=4.17.24 <5.0.0"
  "follow-redirects@<=1.15.11": ">=1.15.12 <2.0.0"
  "postcss@<8.5.10": ">=8.5.10 <9.0.0"
  "webpack-dev-server@<=5.2.3": ">=5.2.4 <6.0.0"
  "ws@>=8.0.0 <8.20.1": ">=8.20.1 <9.0.0"
  "ws@>=7.0.0 <7.5.11": ">=7.5.11 <8.0.0"
  "uuid@<11.1.1": ">=11.1.1 <12.0.0"
  "@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3": ">=7.29.4 <8.0.0"
  "shell-quote@>=1.1.0 <=1.8.3": ">=1.8.4 <2.0.0"
  "joi@<17.13.4": ">=17.13.4 <18.0.0"
  "launch-editor@<=2.14.0": ">=2.14.1 <3.0.0"
  "http-proxy-middleware@>=0.16.0 <2.0.10": ">=2.0.10 <3.0.0"
  "js-yaml@>=4.0.0 <=4.1.1": ">=4.1.2 <5.0.0"
  "websocket-driver@<0.7.5": ">=0.7.5 <0.8.0"
  "@babel/core@<=7.29.0": ">=7.29.1 <8.0.0"
  "body-parser@<1.20.6": ">=1.20.6 <2.0.0"
  "fast-uri@>=3.0.0 <=3.1.3": ">=3.1.4 <4.0.0"
  "nanoid@<3.3.16": ">=3.3.16 <4.0.0"

# image-size is still flagged by `pnpm audit` (advisories require >=2.0.3) but
# has no compatible fix available: 2.0.2 is the latest published version.
#
# No minimumReleaseAgeExclude here on purpose: if the newest patched release of
# an overridden package hasn't cleared the minimumReleaseAge window yet, pnpm
# just resolves to the next-newest version in range instead — still fixed, just
# not bleeding-edge. That may leave a package one patch behind the latest
# advisory for a few days until it ages past the gate.
