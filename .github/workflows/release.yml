name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (like 1.0.0)'
        required: true

jobs:
  bump:
    env:
      TZ: Asia/Tokyo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Make release commit and push it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/bump.sh ${{ github.event.inputs.version }}
          git push --atomic origin HEAD v${{ github.event.inputs.version }}

  update-docs:
    if: ${{ !contains(github.event.inputs.version, '-') }}
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: latest-docs
          token: ${{ steps.app-token.outputs.token }}
      - name: Fetch tags
        run: git fetch --prune --unshallow --tags
      - name: Merge latest release
        run: |
          git merge --ff-only v${{ github.event.inputs.version }}
          git push
