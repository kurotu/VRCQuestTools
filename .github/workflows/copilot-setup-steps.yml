name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    # Unity Editor runs directly on the runner and requires libxml2.so.2, which Ubuntu 26.04 no longer provides.
    runs-on: ubuntu-24.04

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # NOTE: Unity version and changeset are embedded directly in the steps instead of using env variables
    # because Copilot coding agent doesn't properly use env parameters when setting up the environment.
    # Unity Version: 2022.3.22f1, Changeset: 887be4894c44

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Cache Library folder
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-build-${{ github.ref }}
          restore-keys: |
            Library-build-

      - name: Set up vrc-get
        uses: anatawa12/sh-actions/setup-vrc-get@master

      - name: Add VPM Catalog repository
        run: vrc-get repo add https://vpm-catalog.vercel.app/index.json

      - name: Resolve VPM packages
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 60
          command: vrc-get resolve
      - run: vrc-get info project

      # The native Unity Hub no longer supports `unityhub -- --headless install`, so install Unity Editor with the Unity CLI.
      # xz-utils is used by the Unity CLI to extract the Editor installer. The other libraries are runtime
      # dependencies of Unity Editor that the unityhub package used to pull in.
      - name: Setup Unity CLI
        run: |
          wget -qO - https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg > /dev/null
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/Unity_Technologies_ApS.gpg] https://hub.unity3d.com/linux/repos/deb stable main" > /etc/apt/sources.list.d/unity.list'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unity-cli xz-utils libglu1-mesa libgtk-3-0t64 libnss3 libasound2t64 xvfb
          unity --version

      - name: Cache Unity Editor
        id: cache-unity-editor
        uses: actions/cache@v5
        with:
          path: ~/Unity/Hub/Editor
          key: Unity-Editor-2022.3.22f1-${{ github.head_ref || github.ref }}
          restore-keys: |
            Unity-Editor-2022.3.22f1-

      - name: Set Unity Editor path
        run: |
          UNITY_PATH="$HOME/Unity/Hub/Editor/2022.3.22f1/Editor/Unity"
          echo "UNITY_PATH=$UNITY_PATH" >> $GITHUB_ENV

      - name: Install Unity Editor
        env:
          UNITY_NON_INTERACTIVE: "1"
          UNITY_NO_BANNER: "1"
        run: |
          if [ -x "$UNITY_PATH" ]; then
            echo "Unity Editor already installed, skipping installation"
          else
            # Start clean in case a partial installation was restored from the cache.
            rm -rf "$HOME/Unity/Hub/Editor/2022.3.22f1"
            mkdir -p "$HOME/Unity/Hub/Editor"
            unity install-path --set "$HOME/Unity/Hub/Editor"
            unity install 2022.3.22f1 --changeset 887be4894c44 --module windows-mono --accept-eula --format human
          fi
          "$UNITY_PATH" -version

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: cd Website && pnpm install --frozen-lockfile

      - name: Generate solution
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          max_attempts=5
          base_delay=30
          for i in $(seq 1 "$max_attempts"); do
            if UNITY_COMMAND=${UNITY_PATH} xvfb-run ./.github/workflows/unity.sh -batchmode -nographics -logFile /dev/stdout -projectPath . -executeMethod Packages.Rider.Editor.RiderScriptEditor.SyncSolution -quit; then
              exit 0
            fi
            if [ "$i" -lt "$max_attempts" ]; then
              delay=$((base_delay * 2 ** (i - 1)))
              echo "Attempt $i failed. Retrying in ${delay} seconds..."
              sleep "$delay"
            fi
          done
          exit 1
